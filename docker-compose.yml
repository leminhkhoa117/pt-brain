services:
  mongo:
    image: mongo:7
    container_name: pt-brain-mongo
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: pt-brain-server
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      NODE_ENV: development
      PORT: 4000
      # Docker chạy trực tiếp, không qua reverse proxy.
      TRUST_PROXY: 0
      MONGO_URI: mongodb://mongo:27017/pt-brain
      CLIENT_ORIGIN: http://localhost:5173
      APP_PUBLIC_URL: http://localhost:5173
      SESSION_REFRESH_TTL_HOURS: ${SESSION_REFRESH_TTL_HOURS:-24}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM: "${MAIL_FROM:-PT Brain <no-reply@ptbrain.local>}"
      PASSWORD_RESET_TTL_MINUTES: ${PASSWORD_RESET_TTL_MINUTES:-30}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev-access-secret-change-me}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev-refresh-secret-change-me}
      AI_PROVIDER: ${AI_PROVIDER:-opencode-go}
      AI_BASE_URL: ${AI_BASE_URL:-https://opencode.ai/inference/go/openai/v1}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-deepseek-v4.1-flash}
      AI_VISION_MODEL: ${AI_VISION_MODEL:-gemini-4-argon}
      AI_TIMEOUT_MS: ${AI_TIMEOUT_MS:-180000}
      CONTACT_EMAIL: ${CONTACT_EMAIL:-dev@example.com}
      PDF_MAX_MB: ${PDF_MAX_MB:-20}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-disk}
    ports:
      - "127.0.0.1:4000:4000"
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    volumes:
      - ./server/src:/app/server/src
      - ./shared:/app/shared
      - uploads_data:/app/server/uploads

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    container_name: pt-brain-client
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      VITE_API_PROXY_TARGET: http://server:4000
    ports:
      # Chỉ mở trong máy. Muốn test điện thoại trong LAN thì đổi thành "5173:5173".
      - "127.0.0.1:5173:5173"
    depends_on:
      - server
    volumes:
      - ./client/src:/app/client/src
      - ./shared:/app/shared

volumes:
  mongo_data:
  uploads_data:

services:
  mongo:
    image: mongo:7
    container_name: pt-brain-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: pt-brain-server
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 4000
      MONGO_URI: mongodb://mongo:27017/pt-brain
      CLIENT_ORIGIN: http://localhost:5173
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev-access-secret-change-me}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev-refresh-secret-change-me}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-4-5}
    ports:
      - "4000:4000"
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - ./server/src:/app/server/src
      - ./shared:/app/shared

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    container_name: pt-brain-client
    restart: unless-stopped
    environment:
      VITE_API_PROXY_TARGET: http://server:4000
    ports:
      - "5173:5173"
    depends_on:
      - server
    volumes:
      - ./client/src:/app/client/src
      - ./shared:/app/shared

volumes:
  mongo_data:

services:
  - type: web
    name: pt-brain
    runtime: node
    plan: free
    region: singapore
    # NODE_ENV=production khiến npm ci bỏ devDependencies; ép cài dev để có vite
    buildCommand: npm ci && npm --prefix server ci && npm --prefix client ci --include=dev && npm --prefix client run build
    startCommand: node server/src/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: SERVE_CLIENT
        value: "true"
      - key: COOKIE_SECURE
        value: "true"
      # Render free không có ổ đĩa persistent: lưu ảnh/PDF trong MongoDB Atlas
      - key: STORAGE_DRIVER
        value: mongo
      - key: MONGO_URI
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CLIENT_ORIGIN
        sync: false
      - key: APP_PUBLIC_URL
        sync: false
      - key: SESSION_REFRESH_TTL_HOURS
        value: "24"
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: PASSWORD_RESET_TTL_MINUTES
        value: "30"
      - key: AI_PROVIDER
        value: opencode-go
      - key: AI_BASE_URL
        value: https://opencode.ai/inference/go/openai/v1
      - key: AI_API_KEY
        sync: false
      - key: AI_MODEL
        value: deepseek-v4.1-flash
      - key: AI_VISION_MODEL
        value: gemini-4-argon
      - key: AI_TIMEOUT_MS
        value: "180000"
      - key: AI_DAILY_LIMIT_PER_USER
        value: "30"
      - key: CONTACT_EMAIL
        sync: false
      - key: PDF_MAX_MB
        value: "20"
      # Monitoring tùy chọn: để trống SENTRY_DSN/VITE_SENTRY_DSN để tắt.
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_ENVIRONMENT
        value: production
      - key: SENTRY_TRACES_SAMPLE_RATE
        value: "0"
      - key: VITE_SENTRY_DSN
        sync: false
      - key: VITE_SENTRY_ENVIRONMENT
        value: production
      - key: VITE_SENTRY_TRACES_SAMPLE_RATE
        value: "0"

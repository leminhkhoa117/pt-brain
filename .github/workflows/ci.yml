name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      MONGO_URI: mongodb://127.0.0.1:27017/pt-brain-ci
      JWT_ACCESS_SECRET: ci-access-secret-not-for-production
      JWT_REFRESH_SECRET: ci-refresh-secret-not-for-production
      CONTACT_EMAIL: ci@example.com

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            client/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix server ci
          npm --prefix client ci

      - name: Lint
        run: npm run lint

      - name: Test (unit + API integration)
        run: npm run test

      - name: Build client
        run: npm run build

      - name: Smoke test production serving
        env:
          NODE_ENV: production
          PORT: 4100
          SERVE_CLIENT: 'true'
          COOKIE_SECURE: 'false'
          MONGO_URI: mongodb://127.0.0.1:27017/pt-brain-ci-smoke
        run: |
          node server/src/index.js > /tmp/pt-brain-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:4100/api/health > /tmp/health.json; then break; fi
            sleep 1
          done
          cat /tmp/health.json
          curl -fsS http://127.0.0.1:4100/ | grep -q '<title>PT Brain</title>'
          kill $SERVER_PID

      # Chỉ chặn critical; high severity đang được theo dõi trong IMPROVEMENT_PLAN
      # (zod < 4.6.6, react-router < 7.18.5) và sẽ xử lý ở đợt nâng cấp riêng.
      - name: Audit production dependencies
        run: |
          npm --prefix server audit --omit=dev --audit-level=critical
          npm --prefix client audit --omit=dev --audit-level=critical

  docker:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Build server image
        run: docker build -f server/Dockerfile -t pt-brain-server:ci .

      - name: Build client image
        run: docker build -f client/Dockerfile -t pt-brain-client:ci .
